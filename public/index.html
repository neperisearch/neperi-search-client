<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neperi Search sample</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='6.5' cy='6.5' r='4.5' fill='none' stroke='%232b5cc8' stroke-width='2'/%3E%3Cpath d='M10 10l4.5 4.5' stroke='%232b5cc8' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <!-- the pages, as the Neperi console has them: the data stores, and their records searched with filters -->
    <aside class="side">
      <div class="brand">Neperi <small>Search sample</small></div>
      <div class="nav-group">Neperi Search</div>
      <nav class="nav" aria-label="Pages">
        <a href="#/stores" data-page="stores"><span class="ico">▤</span>Data stores</a>
        <a href="#/records" data-page="records"><span class="ico">⌕</span>Records</a>
      </nav>
    </aside>
    <main class="main">
      <div class="topbar">
        <h1 id="title">Neperi Search</h1>
        <div class="who"><span id="mode"></span><button type="button" id="theme" title="Theme">◐ System</button></div>
      </div>
      <section id="page" class="card"></section>
    </main>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
